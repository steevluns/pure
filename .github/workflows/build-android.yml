name: Universal Android Builder

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Java Version
        id: java
        shell: bash
        run: |
          if grep -RqsE 'jvmToolchain\(21\)|JavaVersion.VERSION_21|jvmTarget = "21"' --include='*.gradle' --include='*.gradle.kts' .; then
            echo "version=21" >> "$GITHUB_OUTPUT"
          elif grep -RqsE 'jvmToolchain\(17\)|JavaVersion.VERSION_17|jvmTarget = "17"' --include='*.gradle' --include='*.gradle.kts' .; then
            echo "version=17" >> "$GITHUB_OUTPUT"
          elif grep -RqsE 'jvmToolchain\(11\)|JavaVersion.VERSION_11' --include='*.gradle' --include='*.gradle.kts' .; then
            echo "version=11" >> "$GITHUB_OUTPUT"
          else
            echo "version=17" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.version }}

      - name: Locate Gradle Wrapper
        id: gradle
        shell: bash
        run: |
          if [ -f gradlew ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            FILE=$(find . -name gradlew -type f | head -n 1)
            if [ -z "$FILE" ]; then
              echo "Gradle wrapper not found"
              exit 1
            fi
            echo "dir=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        shell: bash
        run: |
          cd "${{ steps.gradle.outputs.dir }}"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
